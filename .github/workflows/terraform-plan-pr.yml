name: Terraform Plan (PR)

on:
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.tf"
      - "env/*.tfvars"
      - ".github/workflows/terraform-*.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Plan (dev)
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔍 DEBUG STEP — NOW IN THE RIGHT PLACE
      - name: Debug — show repo structure
        shell: bash
        run: |
          echo "Current directory:"
          pwd
          echo "Files at root:"
          ls -la
          echo "Files in env folder:"
          ls -la env

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      # Guard: ensure required GitHub Environment vars exist (dev)
      - name: Guard — ensure required env vars exist
        shell: bash
        run: |
          echo "AWS_REGION=${{ vars.AWS_REGION }}"
          echo "AWS_ROLE_ARN=${{ vars.AWS_ROLE_ARN }}"
          test -n "${{ vars.AWS_REGION }}" || (echo "❌ Missing AWS_REGION in GitHub Environment: dev" && exit 1)
          test -n "${{ vars.AWS_ROLE_ARN }}" || (echo "❌ Missing AWS_ROLE_ARN in GitHub Environment: dev" && exit 1)

      # Guard: ensure tfvars file exists and contains required keys (dev)
      - name: Guard — ensure env/dev.tfvars exists
        shell: bash
        run: |
          test -f "env/dev.tfvars" || (echo "❌ Missing env/dev.tfvars" && exit 1)
          echo "✅ env/dev.tfvars found"

      - name: Guard — ensure required keys exist in env/dev.tfvars
        shell: bash
        run: |
          # Only check keys that truly must be present (adjust if you add defaults in variables.tf)
          required_keys=(bucket_name region vpc_cidr public_subnet_cidrs private_subnet_cidrs azs instance_type desired_capacity min_size max_size)
          for k in "${required_keys[@]}"; do
            if ! grep -Eq "^[[:space:]]*${k}[[:space:]]*=" "env/dev.tfvars"; then
              echo "❌ Missing '${k}=' in env/dev.tfvars"
              exit 1
            fi
          done
          echo "✅ Required keys present in env/dev.tfvars"

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan (dev)
        run: terraform plan -input=false -var-file="env/dev.tfvars" -no-color

      - name: PR comment (success)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "✅ Terraform plan (dev) completed successfully."
            })

      - name: PR comment (failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "❌ Terraform plan (dev) failed. Open the Actions logs to see which guard/step failed."
            })
