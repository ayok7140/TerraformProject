name: Terraform Destroy (Controlled)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to DESTROY?"
        type: choice
        required: true
        options:
          - dev
          - stage
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: Destroy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    concurrency:
      group: terraform-destroy-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — only main can destroy stage/prod
        if: ${{ inputs.environment != 'dev' && github.ref != 'refs/heads/main' }}
        run: |
          echo "Only main branch can destroy stage/prod."
          exit 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Select workspace
        run: |
          terraform workspace select ${{ inputs.environment }} || terraform workspace new ${{ inputs.environment }}

      - name: Terraform destroy
        run: |
          terraform destroy -input=false \
            -var-file="env/${{ inputs.environment }}.tfvars" \
            -auto-approve
