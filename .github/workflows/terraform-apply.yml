name: Terraform Apply (Controlled)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to apply?"
        type: choice
        required: true
        options:
          - dev
          - stage
          - prod

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-apply-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: |
          terraform plan -input=false -var-file="env/${{ inputs.environment }}.tfvars" -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan
